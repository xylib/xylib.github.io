<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#9bdedb">
<title>元宝的切切切工厂</title>
<style>
  :root{--ink:#254b50;--cream:#fff9e8;--orange:#f58b51;--deep:#d96a3a;--teal:#4a9fa5;--mint:#a2d7c6}
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:ui-rounded,"Arial Rounded MT Bold","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:#a9dcd1}
  button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
  #app{position:relative;width:100vw;height:100dvh;overflow:hidden;isolation:isolate;background:linear-gradient(#a8dfdf 0%,#e1efe1 67%,#a1ceb1 100%)}
  #landscape{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
  .topbar{position:absolute;z-index:8;left:clamp(14px,3vw,42px);right:clamp(14px,3vw,42px);top:clamp(12px,2.4vh,28px);display:flex;align-items:center;gap:12px;justify-content:space-between;pointer-events:none}
  .brand{display:flex;align-items:center;gap:10px;min-width:0;filter:drop-shadow(0 2px 0 #fff8)}
  .brand-mark{width:48px;height:48px;border-radius:17px;background:#ffcb74;display:grid;place-items:center;border:3px solid #fff7e2;box-shadow:0 4px 0 #b6774e;transform:rotate(-5deg)}
  .brand-mark svg{width:35px;height:35px}
  .brand strong{font-size:clamp(19px,2.4vw,30px);letter-spacing:.035em;white-space:nowrap;color:#25565b;text-shadow:0 2px #fff9}
  .brand small{display:block;font-size:12px;color:#477474;font-weight:800;letter-spacing:.16em;margin-top:1px}
  .hud{display:flex;align-items:center;gap:9px;pointer-events:auto}
  .pill{background:#fffaf0eb;border:2px solid #ffffff;box-shadow:0 5px 0 #4b8b8a30,0 8px 20px #406d6230;border-radius:19px;min-height:46px;padding:5px 14px;display:flex;align-items:center;gap:9px;white-space:nowrap;font-weight:900}
  .pill .icon{font-size:23px}.pill span.label{font-size:12px;color:#668584}.pill b{font-size:23px;font-variant-numeric:tabular-nums;line-height:1;color:#e47748}
  .mini{border:2px solid #fffdf3;background:#fffaf0ec;color:#427b7b;box-shadow:0 4px 0 #4b8b8a30;border-radius:16px;height:46px;min-width:46px;padding:0 12px;font-weight:900;font-size:20px}
  .mini:hover,.secondary:hover{transform:translateY(-2px)}.mini:active,.secondary:active{transform:translateY(2px);box-shadow:0 2px 0 #4b8b8a30}
  #arena{position:absolute;left:clamp(14px,3vw,44px);right:clamp(14px,3vw,44px);top:clamp(80px,12vh,112px);bottom:clamp(109px,19vh,180px);min-height:0;overflow:hidden;border:7px solid #f9f4da;border-radius:32px;background:radial-gradient(circle at 52% 30%,#f9f4dc99,#d0e9d5a0 60%,#a1c9b3a8);box-shadow:0 10px 0 #528d8677,0 25px 45px #25635b50,inset 0 0 0 3px #77a7a57d;touch-action:none}
  #camera{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);opacity:.86;filter:saturate(.95) contrast(1.02);display:none}
  #arena.has-camera #camera{display:block}
  #loading{position:absolute;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%);width:min(310px,85%);padding:20px 15px;border:3px solid #fff9e8;border-radius:24px;background:#fff9eadd;box-shadow:0 8px 30px #326b6655;text-align:center;color:#477d79;font-weight:900;line-height:1.5;display:none;pointer-events:none}
  #arena.loading #loading{display:block}
  #loading .spin{width:38px;height:38px;margin:0 auto 9px;border:5px solid #a8d9c5;border-top-color:#ef9554;border-radius:50%;animation:spin .9s linear infinite}
  #loading small{display:block;color:#7b9991;font-size:11px;margin-top:4px}
  @keyframes spin{to{transform:rotate(360deg)}}
  #arena:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#cce6d5a1,transparent 18%,transparent 82%,#cce6d5a1),linear-gradient(0deg,#d4e9da7b,transparent 14%,transparent 84%,#f8efcc45)}
  #fx{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
  #cargo{position:absolute;inset:0;width:100%;height:100%;z-index:6;pointer-events:none}
  #arena .corner{position:absolute;z-index:3;font-size:13px;letter-spacing:.08em;font-weight:900;color:#fff;background:#337d7cae;border:2px solid #d0f5e8ad;padding:7px 12px;border-radius:0 0 15px 0;text-shadow:0 1px #3a6664}
  #arena .corner.right{left:auto;right:0;border-radius:0 0 0 15px}
  #cameraHint{position:absolute;z-index:3;bottom:13px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#fff8e8e9;color:#4a7978;border:1px solid #fff;border-radius:99px;padding:6px 15px;font-size:12px;font-weight:900;box-shadow:0 3px 12px #2b65572a;pointer-events:none;transition:opacity .4s}
  #burstWord{position:absolute;z-index:4;left:50%;top:46%;transform:translate(-50%,-50%) scale(.6) rotate(-5deg);opacity:0;color:#fff8df;font-weight:1000;font-size:clamp(40px,8vw,95px);letter-spacing:.09em;white-space:nowrap;pointer-events:none;text-shadow:5px 6px 0 #e77e4e,-3px -3px 0 #f6b65a,0 12px 25px #b54d3566}
  #burstWord.pop{animation:word .65s cubic-bezier(.16,.8,.3,1) both}
  @keyframes word{0%{opacity:0;transform:translate(-50%,-42%) scale(.5) rotate(-11deg)}23%{opacity:1;transform:translate(-50%,-60%) scale(1.12) rotate(4deg)}60%{opacity:1;transform:translate(-50%,-68%) scale(1) rotate(-2deg)}100%{opacity:0;transform:translate(-50%,-82%) scale(.95) rotate(-2deg)}}
  .belt{position:absolute;left:-3%;right:-3%;bottom:clamp(43px,8.3vh,82px);height:clamp(56px,10vh,92px);z-index:5;pointer-events:none;filter:drop-shadow(0 12px 10px #42685255)}
  .belt .rail{height:38%;border-radius:28px;background:repeating-linear-gradient(90deg,#d5aa70 0 56px,#aa794d 56px 62px);border:5px solid #577d78;box-shadow:inset 0 5px #f6d6a8,0 5px #345c5b}
  .belt .dark{position:absolute;top:33%;left:0;right:0;height:35%;background:#457b78;border-top:5px solid #83b1a2;border-bottom:5px solid #2e5e60}
  .belt .rollers{position:absolute;top:41%;left:0;right:0;height:21%;background:repeating-linear-gradient(90deg,transparent 0 47px,#9ac1aa 48px 56px,transparent 57px 80px);animation:rolling 3s linear infinite}
  @keyframes rolling{to{background-position:80px 0}}
  .belt .base{position:absolute;top:68%;height:15%;left:0;right:0;border-radius:14px;background:#f0bc78;border:4px solid #7a8b78}
  .train{position:absolute;right:5%;bottom:1%;z-index:7;width:clamp(122px,18vw,250px);height:auto;filter:drop-shadow(0 10px 3px #31545155);pointer-events:none;animation:chug 2.5s ease-in-out infinite}
  @keyframes chug{50%{transform:translateY(-3px)}}
  .bottomline{position:absolute;z-index:8;bottom:clamp(11px,2vh,20px);left:clamp(16px,3vw,42px);right:clamp(16px,3vw,42px);display:flex;align-items:end;justify-content:space-between;gap:16px}
  .instruction{border:2px solid #ffffffb8;border-radius:18px;background:#fffaf0de;padding:8px 16px;font-size:clamp(13px,1.4vw,17px);font-weight:900;box-shadow:0 4px 0 #5c8e8036;max-width:70%;line-height:1.3}
  .instruction small{display:block;color:#668986;font-size:11px;font-weight:800;margin-top:3px}
  .status{border-radius:20px;background:#367d79dd;color:#fff9e9;border:2px solid #b8ded0;box-shadow:0 4px #29686255;padding:9px 13px;font-weight:900;font-size:12px;text-align:right;max-width:35%}
  #overlay{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:#205d61a8;backdrop-filter:blur(7px);padding:18px}
  #overlay.hidden{display:none}
  .welcome{width:min(850px,96vw);display:grid;grid-template-columns:1.12fr .88fr;border:7px solid #fff8de;border-radius:34px;overflow:hidden;background:#fffbef;box-shadow:0 18px 0 #2a636c7a,0 35px 80px #174e6080;max-height:min(660px,94dvh)}
  .welcome .copy{padding:clamp(24px,3.4vw,45px);display:flex;flex-direction:column;justify-content:center}
  .eyebrow{font-weight:1000;letter-spacing:.14em;color:#e77748;font-size:14px}
  h1{margin:10px 0 12px;font-size:clamp(38px,5vw,65px);line-height:1.08;color:#265b5c;letter-spacing:-.03em}
  h1 em{font-style:normal;color:#ee8753}
  .intro{font-size:clamp(15px,1.55vw,19px);line-height:1.6;font-weight:800;color:#477b79;margin:0 0 18px}
  .steps{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:20px}.steps span{padding:6px 9px;border-radius:11px;background:#e8f4e4;color:#52837e;font-size:12px;font-weight:900}
  .primary{border:0;border-radius:18px;background:#f58c54;color:white;min-height:57px;padding:8px 23px;font-size:21px;font-weight:1000;box-shadow:0 7px 0 #c66036,0 12px 15px #c6603630;text-shadow:0 2px #b85b34;width:100%}
  .primary:hover{transform:translateY(-2px)}.primary:active{transform:translateY(4px);box-shadow:0 3px 0 #c66036}
  .secondary{border:2px solid #c9e6d5;border-radius:14px;background:#f6fbef;color:#4d8581;box-shadow:0 4px #7ea5984c;min-height:40px;padding:5px 16px;font-size:14px;font-weight:900;margin-top:13px;width:100%}
  .privacy{font-size:11px;line-height:1.5;color:#829995;margin-top:18px;font-weight:700}
  .poster{position:relative;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 55% 30%,#fff2bd,#f8cf84 65%,#e8a96c);border-left:5px solid #f4e6c2}
  .poster:before{content:"";position:absolute;width:360px;height:360px;border:4px dashed #fff5d7;opacity:.75;border-radius:50%;top:-120px;left:-70px}
  .poster svg{position:relative;width:92%;height:auto;max-height:90%;filter:drop-shadow(0 12px 3px #ba78443c)}
  #toast{position:absolute;z-index:30;top:77px;left:50%;transform:translateX(-50%) translateY(-8px);border:2px solid #fff;border-radius:15px;padding:8px 17px;background:#317e7ce8;color:white;box-shadow:0 8px 18px #34575555;font-weight:900;font-size:13px;opacity:0;pointer-events:none;transition:.24s;max-width:80vw;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  input[type=file]{display:none}
  @media(max-width:660px){.brand small{display:none}.brand-mark{width:39px;height:39px}.brand strong{font-size:17px}.pill{min-height:44px;padding:4px 9px}.pill .icon{font-size:18px}.pill span.label{display:none}.pill b{font-size:18px}.mini{height:44px;min-width:44px;padding:0 7px;font-size:17px}.topbar{top:calc(env(safe-area-inset-top) + 8px);display:grid;grid-template-columns:1fr;gap:9px;left:12px;right:12px}.hud{gap:5px;justify-content:space-between;width:100%}.welcome{grid-template-columns:1fr;overflow:auto}.poster{display:none}.welcome .copy{padding:25px}.instruction{font-size:12px;max-width:58%}.instruction small{display:none}.status{font-size:11px;max-width:40%}#arena{top:calc(env(safe-area-inset-top) + 112px);bottom:calc(env(safe-area-inset-bottom) + 115px);border-width:5px;border-radius:22px}#arena .corner{font-size:10px;padding:5px 7px}.belt{bottom:calc(env(safe-area-inset-bottom) + 48px);height:72px}.bottomline{bottom:calc(env(safe-area-inset-bottom) + 7px);left:12px;right:12px}.train{right:1%;bottom:calc(env(safe-area-inset-bottom) + 3px)}}
  @media(max-height:600px){#arena{top:68px;bottom:80px}.belt{bottom:26px;height:55px}.bottomline{bottom:4px}.instruction{padding:4px 10px}.status{padding:4px 9px}.topbar{top:8px}.welcome .copy{padding:20px}h1{font-size:36px}.intro{margin-bottom:10px}.steps{margin-bottom:10px}.privacy{margin-top:9px}}
  @media(max-width:660px) and (max-height:600px){#arena{top:calc(env(safe-area-inset-top) + 104px);bottom:calc(env(safe-area-inset-bottom) + 82px)}.topbar{top:calc(env(safe-area-inset-top) + 5px)}.belt{bottom:calc(env(safe-area-inset-bottom) + 25px);height:54px}.bottomline{bottom:calc(env(safe-area-inset-bottom) + 3px)}}
</style>
</head>

<script>
(()=>{'use strict';

  let w=0,h=0,appW=0,appH=0,dpr=1,running=false,gameReady=false,hasCamera=false,score=0,combo=0,comboAt=0,fruit=[],cargo=[],bits=[],texts=[],rings=[],lastFrame=0,lastSpawn=0,stream=null,hands=null,handsTimer=null,handsBusy=false,trackedHands=[],fingerTips=[],trails=[],pointerTracks=new Map();

  function musicTick(){if(!musicOn||!running||customTracks.length)return;const notes=[392,0,523,0,587,523,440,0,392,0,330,392,440,0,523,0],n=notes[musicStep%notes.length];if(n&&audioCtx){const t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=n;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.014,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.15);o.connect(g).connect(audioCtx.destination);o.start(t);o.stop(t+.17)}musicStep++}
  function manageMusic(){clearInterval(musicTimer);if(currentAudio){currentAudio.pause();currentAudio=null}if(!running||!musicOn)return;if(customTracks.length){const f=customTracks[trackIndex%customTracks.length],url=URL.createObjectURL(f),a=new Audio(url);a.volume=.45;currentAudio=a;a.onended=()=>{URL.revokeObjectURL(url);trackIndex++;manageMusic()};a.play().catch(()=>toast('点一下音乐按钮，就能播放自己选择的歌曲'));return}musicTimer=setInterval(musicTick,240)}
  $('#musicBtn').onclick=()=>{startAudio();musicOn=!musicOn;$('#musicBtn').textContent=musicOn?'♫':'♪̸';$('#musicBtn').style.opacity=musicOn?'1':'.55';manageMusic();toast(musicOn?'音乐打开啦':'音乐已关闭')};

  function pathRound(c,x,y,ww,hh,rad){c.beginPath();c.roundRect(x,y,ww,hh,rad)}
  function makeSprite(type){let c=document.createElement('canvas');c.width=c.height=160;let p=c.getContext('2d');p.translate(80,80);p.lineJoin='round';p.lineCap='round';let [base]=colors[type],outline='#775d4e';p.fillStyle=base;p.strokeStyle=outline;p.lineWidth=4;

    const leaf=(x,y,rot=0)=>{p.save();p.translate(x,y);p.rotate(rot);p.fillStyle='#73b678';p.strokeStyle='#547f57';p.lineWidth=3;p.beginPath();p.moveTo(0,0);p.quadraticCurveTo(-17,-21,-30,-9);p.quadraticCurveTo(-19,8,0,0);p.fill();p.stroke();p.restore()};
    if(type==='carrot'){p.beginPath();p.moveTo(-29,-44);p.quadraticCurveTo(2,-53,34,-39);p.quadraticCurveTo(28,11,0,64);p.quadraticCurveTo(-34,13,-29,-44);p.fill();p.stroke();p.strokeStyle='#6da66d';p.lineWidth=10;for(let i=-1;i<=1;i++){p.beginPath();p.moveTo(0,-44);p.quadraticCurveTo(i*25,-70,i*24,-64);p.stroke()}p.strokeStyle='#d7723e';p.lineWidth=3;for(let y=-12;y<33;y+=19){p.beginPath();p.moveTo(-17,y);p.lineTo(-7,y+2);p.stroke()}}
    else if(type==='eggplant'){p.save();p.rotate(-.38);ellipse(0,10,36,54);p.fillStyle='#7eb977';p.beginPath();p.moveTo(-35,-31);p.quadraticCurveTo(-16,-65,2,-43);p.quadraticCurveTo(18,-69,36,-31);p.quadraticCurveTo(5,-40,-35,-31);p.fill();p.stroke();p.strokeStyle='#5b8d5c';p.lineWidth=7;p.beginPath();p.moveTo(0,-44);p.lineTo(6,-64);p.stroke();p.restore()}
    else if(type==='broccoli'){p.fillStyle='#9ac777';pathRound(p,-16,-4,32,61,8);p.fill();p.stroke();p.fillStyle='#68a879';for(const [x,y,r] of [[-31,-15,24],[-14,-36,27],[11,-40,28],[31,-17,24],[-2,-12,30]]){p.beginPath();p.arc(x,y,r,0,7);p.fill();p.stroke()}}
    else if(type==='strawberry'){p.beginPath();p.moveTo(-44,-24);p.bezierCurveTo(-50,10,-12,54,0,62);p.bezierCurveTo(14,52,50,9,44,-24);p.quadraticCurveTo(0,-56,-44,-24);p.fill();p.stroke();p.fillStyle='#ffe9ba';for(let i=0;i<11;i++){const a=i*2.399,r=13+14*(i%3);p.beginPath();p.ellipse(Math.cos(a)*r,Math.sin(a)*r+5,2,4,.3,0,7);p.fill()}for(let i=-2;i<=2;i++)leaf(i*9,-37,i*.35+Math.PI/2)}

    else if(type==='orange'){ellipse(0,4,49,49);leaf(5,-41,-.3);p.fillStyle='#b98342';p.beginPath();p.arc(0,-43,4,0,7);p.fill()}

  const sprites=Object.fromEntries(types.map(t=>[t,makeSprite(t)]));
  function spawn(){if(fruit.length>=(w<520?8:CONF.maxFruit))return;let t=types[Math.floor(Math.random()*types.length)],size=2*clamp(Math.min(w,h)*rand(.115,.16),60,110),x=rand(size*.48,w-size*.48),y=rand(size*.48,h-size*.48);fruit.push({t,x,y,size,vx:rand(-14,14),vy:rand(-19,8),rot:rand(-.25,.25),vr:rand(-.28,.28),age:0,bob:rand(0,7),cut:false})}

  function createCargo(f){
    const ar=arena.getBoundingClientRect(),root=app.getBoundingClientRect();

      y:ar.top-root.top+f.y,vx:side*rand(65,105),vy:rand(-190,-120),

  }
  function distanceToSegment(px,py,ax,ay,bx,by){
    const dx=bx-ax,dy=by-ay,t=clamp(((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy),0,1);
    return Math.hypot(px-(ax+t*dx),py-(ay+t*dy));
  }
  function cutSegment(a,b){
    if(!running||!gameReady||!a||!b)return 0;
    const travel=Math.hypot(b.x-a.x,b.y-a.y);

    trails.push({ax:a.x,ay:a.y,bx:b.x,by:b.y,life:.24});
    if(trails.length>40)trails.shift();
    let count=0;
    for(const f of fruit){
      if(f.cut)continue;
      if(distanceToSegment(f.x,f.y,a.x,a.y,b.x,b.y)<f.size*.40){
        f.cut=true;createCargo(f);particles(f.x,f.y,f.t,15);count++;

      texts.push({x:b.x,y:b.y-20,life:1,text:'+'+count*10});sliceSound(count);

      wordEl.classList.remove('pop');void wordEl.offsetWidth;wordEl.classList.add('pop');

  function drawSprite(f){let s=f.size;ctx.save();ctx.translate(f.x,f.y+Math.sin(f.age*2+f.bob)*4);ctx.rotate(f.rot);ctx.shadowColor='#204d4680';ctx.shadowBlur=10;ctx.shadowOffsetY=9;ctx.drawImage(sprites[f.t],-s/2,-s/2,s,s);ctx.restore()}
  function drawCargoPiece(p,beltY){
    const c=cargoCtx,s=p.size;
    if(p.landed){c.save();c.fillStyle='#244e4b55';c.beginPath();c.ellipse(p.x,beltY+5,s*.28,6,0,0,7);c.fill();c.restore()}

  function renderCargo(dt){

  function render(now){requestAnimationFrame(render);let dt=Math.min((now-lastFrame)/1000||.016,.05);lastFrame=now;ctx.clearRect(0,0,w,h);cargoCtx.clearRect(0,0,appW,appH);if(!running||!gameReady)return;
    if(now-lastSpawn>(w<520?900:CONF.spawnEvery)){lastSpawn=now;spawn();if(fruit.length<(w<520?3:5))spawn()}
    for(let i=fruit.length-1;i>=0;i--){let f=fruit[i];f.age+=dt;if(f.cut){fruit.splice(i,1)}else{f.x+=f.vx*dt;f.y+=f.vy*dt;f.rot+=f.vr*dt;if(f.x<f.size*.45||f.x>w-f.size*.45)f.vx*=-1;if(f.y<f.size*.45||f.y>h-f.size*.45)f.vy*=-1;drawSprite(f)}}
    for(let i=bits.length-1;i>=0;i--){let p=bits[i];p.life-=dt;if(p.life<=0){bits.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=430*dt;ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.c;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.vx*.004);if(p.shape)ctx.fillRect(-p.r/2,-p.r/2,p.r*1.7,p.r*.65);else{ctx.beginPath();ctx.arc(0,0,p.r,0,7);ctx.fill()}ctx.restore()}ctx.globalAlpha=1;
    for(let i=rings.length-1;i>=0;i--){let p=rings[i];p.age+=dt;ctx.globalAlpha=(1-p.age/.43)*.65;ctx.strokeStyle='#fff0b4';ctx.lineWidth=5;ctx.beginPath();ctx.arc(p.x,p.y,p.r*(.35+p.age*1.8),0,7);ctx.stroke();if(p.age>.43)rings.splice(i,1)}ctx.globalAlpha=1;
    for(let i=texts.length-1;i>=0;i--){let p=texts[i];p.life-=dt;p.y-=38*dt;ctx.globalAlpha=p.life;ctx.font='1000 24px ui-rounded,system-ui';ctx.textAlign='center';ctx.lineWidth=5;ctx.strokeStyle='#558b76';ctx.strokeText(p.text,p.x,p.y);ctx.fillStyle='#fff8cf';ctx.fillText(p.text,p.x,p.y);if(p.life<=0)texts.splice(i,1)}ctx.globalAlpha=1;
    for(let i=trails.length-1;i>=0;i--){let p=trails[i];p.life-=dt;if(p.life<=0){trails.splice(i,1);continue}ctx.save();ctx.globalAlpha=p.life/.24;ctx.lineCap='round';ctx.strokeStyle='#fff6bf';ctx.lineWidth=9;ctx.shadowColor='#ffe493';ctx.shadowBlur=14;ctx.beginPath();ctx.moveTo(p.ax,p.ay);ctx.lineTo(p.bx,p.by);ctx.stroke();ctx.lineWidth=3;ctx.strokeStyle='#ffffff';ctx.stroke();ctx.restore()}
    if(hasCamera){for(const p of fingerTips){ctx.save();ctx.fillStyle='#fff9df';ctx.strokeStyle='#ef9b55';ctx.lineWidth=3;ctx.shadowColor='#ffdd95';ctx.shadowBlur=10;ctx.beginPath();ctx.arc(p.x,p.y,7,0,7);ctx.fill();ctx.stroke();ctx.restore()}}
    renderCargo(dt);
  }
  requestAnimationFrame(render);
  function mapHandPoint(p){
    const vw=video.videoWidth,vh=video.videoHeight,aspect=w/h,source=vw/vh;
    let sx=0,sy=0,sw=vw,sh=vh;
    if(source>aspect){sw=vh*aspect;sx=(vw-sw)/2}
    else{sh=vw/aspect;sy=(vh-sh)/2}
    return {x:w*(1-(p.x*vw-sx)/sw),y:h*(p.y*vh-sy)/sh};
  }
  function onHandsResults(results){
    const old=trackedHands,used=new Set(),next=[],tips=[];
    for(const landmarks of results.multiHandLandmarks||[]){
      const wrist=landmarks[0];let match=-1,best=.30;
      for(let j=0;j<old.length;j++){
        if(used.has(j)||performance.now()-old[j].at>320)continue;
        const d=Math.hypot(wrist.x-old[j].wrist.x,wrist.y-old[j].wrist.y);
        if(d<best){best=d;match=j}
      }
      if(match>=0)used.add(match);
      const points={};
      for(const id of [8,12,16,20]){
        const p=mapHandPoint(landmarks[id]);points[id]=p;
        if(p.x>=0&&p.x<=w&&p.y>=0&&p.y<=h)tips.push(p);
        if(match>=0)cutSegment(old[match].points[id],p);
      }
      next.push({wrist:{x:wrist.x,y:wrist.y},points,at:performance.now()});
    }
    trackedHands=next;fingerTips=tips;
    if(tips.length&&hintEl.style.opacity!=='0')hintEl.textContent='看见手指啦，划过蔬果试试！';
  }
  function loadHandScript(){
    if(typeof window.Hands==='function')return Promise.resolve();
    return new Promise((resolve,reject)=>{
      const script=document.createElement('script');
      script.src='https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js';
      script.crossOrigin='anonymous';
      const timeout=setTimeout(()=>{script.remove();reject(new Error('手部识别组件加载超时'))},16000);
      script.onload=()=>{clearTimeout(timeout);typeof window.Hands==='function'?resolve():reject(new Error('手部识别组件未启动'))};
      script.onerror=()=>{clearTimeout(timeout);reject(new Error('手部识别组件下载失败'))};
      document.head.appendChild(script);
    });
  }
  function stopCamera(){
    clearInterval(handsTimer);handsTimer=null;hasCamera=false;trackedHands=[];fingerTips=[];
    stream?.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;
    arena.classList.remove('has-camera','loading');
  }
  async function sendHandFrame(){
    if(!running||!hasCamera||handsBusy||!video.videoWidth)return;
    handsBusy=true;
    try{await hands.send({image:video})}
    catch(e){console.error('手部识别失败',e);stopCamera();state('鼠标 / 手指模式');hintEl.textContent='手部识别中断，请用鼠标或手指划过';toast('手部识别中断，已切换为鼠标 / 触屏玩法')}
    finally{handsBusy=false}
  }
  const pointerPos=e=>{const r=arena.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
  arena.addEventListener('pointerdown',e=>{if(!running)return;arena.setPointerCapture?.(e.pointerId);pointerTracks.set(e.pointerId,pointerPos(e))});
  arena.addEventListener('pointermove',e=>{
    if(!running||!pointerTracks.has(e.pointerId))return;
    const p=pointerPos(e);cutSegment(pointerTracks.get(e.pointerId),p);pointerTracks.set(e.pointerId,p);
  });
  for(const event of ['pointerup','pointercancel','lostpointercapture'])arena.addEventListener(event,e=>pointerTracks.delete(e.pointerId));
  async function cameraStart(){
    try{
      if(!navigator.mediaDevices?.getUserMedia)throw new Error('当前浏览器未开放摄像头');
      const portrait=appW<660&&appH>appW;
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:portrait?480:640},height:{ideal:portrait?640:480},frameRate:{ideal:24,max:30}},audio:false});
      video.srcObject=stream;await video.play();hasCamera=true;arena.classList.add('has-camera');
      state('摄像头已开启 · 正在加载手指识别…');hintEl.textContent='正在准备手指识别…';
      await loadHandScript();
      hands=new window.Hands({locateFile:file=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
      hands.setOptions({maxNumHands:6,modelComplexity:0,minDetectionConfidence:.55,minTrackingConfidence:.55});
      hands.onResults(onHandsResults);
      if(hands.initialize)await hands.initialize();
      // The first inference also loads any remaining model assets. Keep the playfield empty until it succeeds.
      await hands.send({image:video});
      preparePlay();
      handsTimer=setInterval(sendHandFrame,CONF.handFrameMs);
      state('手指识别已开启 · 划过蔬果！');hintEl.textContent='把手伸进画面，用手指划过蔬果';
      toast('手指识别准备好了，划过蔬果才会切开！');
    }catch(e){
      console.error(e);stopCamera();state('鼠标 / 手指模式');
      preparePlay();
      hintEl.textContent='用鼠标或手指划过蔬果';
      toast(e?.name==='NotAllowedError'?'摄像头未获许可，已切换为鼠标玩法':'手指识别不可用，已切换为鼠标玩法');
    }
  }
  async function start(withCamera){
    if(running)return;running=true;overlay.classList.add('hidden');startAudio();
    manageMusic();state('开工啦！');
    hintEl.textContent='用手指划过蔬果！';
    if(withCamera){arena.classList.add('loading');await cameraStart()}
    else{preparePlay();state('鼠标 / 手指模式');hintEl.textContent='按住鼠标或手指划过蔬果'}
  }
  $('#startBtn').onclick=()=>start(true);$('#pointerBtn').onclick=()=>start(false);
  addEventListener('pagehide',()=>{stopCamera();hands?.close?.();if(currentAudio)currentAudio.pause()});
})();
</script>
